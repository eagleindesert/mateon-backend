# ARM 기반 클라우드 배포용 Compose
# ------------------------------------------------------------------------------
# 로컬에서 소스를 빌드하지 않고, DockerHub 에 이미 push 된 이미지를 pull 하여 실행합니다.
# (이미지는 scripts/docker/deploy-dockerhub.ps1 로 arm64 플랫폼으로 빌드/푸시하세요.
#   예: ./scripts/docker/deploy-dockerhub.ps1 -Tag v1.0.0 -Platform linux/arm64)
#
# 사용법 (배포 서버에서):
#   1) 이 파일과 .env 를 서버로 복사한다. (.env 에는 MAIL/JWT/AI 시크릿 포함)
#   2) DOCKERHUB_USERNAME / TAG 를 .env 또는 셸 환경변수로 지정한다.
#   3) docker compose -f docker-compose-deployment.yml up -d
#
# 종료:  docker compose -f docker-compose-deployment.yml down
# 갱신:  docker compose -f docker-compose-deployment.yml pull && \
#        docker compose -f docker-compose-deployment.yml up -d
# ------------------------------------------------------------------------------
services:
  app:
    # DockerHub 이미지를 pull (빌드하지 않음). 태그 미지정 시 latest.
    image: ${DOCKERHUB_USERNAME:-eagleindesert}/mateon-backend:${TAG:-latest}
    # ARM 클라우드에서 멀티아치가 아닌 이미지를 강제 지정하고 싶을 때 사용.
    # 이미지가 arm64 로 push 되어 있어야 정상 동작합니다.
    platform: linux/arm64
    container_name: mateon-app
    restart: unless-stopped
    # dev 프로필로 도는 서버라 로그가 DEBUG 다. json-file 드라이버 기본값은 무제한이라
    # 그대로 두면 디스크가 찬다(Always Free 급 인스턴스에서는 실제로 찬다).
    #
    # 총량은 max-size × max-file = 1GB 다. 여유 20GB 중 5% 인데, 나머지는 이미지 태그와
    # postgres 볼륨이 계속 먹으므로 로그에 더 주지 않는다. 반대로 이보다 짜게 잡으면
    # (예: 10m×3=30MB) DEBUG 로그가 몇 시간 만에 밀려나 정작 장애 때 볼 게 없다.
    #
    # 파일을 잘게 쪼개는 건 회전이 지워 버리는 단위가 곧 max-size 라서다 — 1000m×1 이면
    # 한 번 넘칠 때 1GB 가 통째로 사라진다.
    #
    # 실제 증가 속도를 보고 조정한다(서버에서):
    #   du -h $(docker inspect --format='{{.LogPath}}' mateon-app)
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"
    # 애플리케이션 시크릿(MAIL/JWT/AI 등)은 .env 파일에서 주입
    env_file:
      - .env
    environment:
      # 운영 환경이 아직 없다. 이 서버는 "배포된 개발 서버"이고, prod 프로필은 만들어만 뒀지
      # 켜는 곳이 없다. 그러니 여기서 prod 를 주면 실제와 다른 소리를 하는 셈이라 dev 로 둔다.
      # (spring.profiles.default 가 dev 라 이 줄이 없어도 결과는 같지만, 배포 파일을 열었을 때
      #  어느 프로필로 도는지 바로 보이도록 남긴다.)
      #
      # dev 로 돈다는 게 서버에서 뜻하는 것 — 운영으로 승격할 때 이 목록을 되짚는다:
      #   - CORS 기본값이 "*" 다. 좁히려면 .env 에 CORS_ALLOWED_ORIGINS 를 준다(그쪽이 이긴다).
      #     prod 와 달리 설정 누락을 부팅으로 잡아 주지 않으니 오타는 조용히 전체 허용이 된다.
      #   - /debug/oauth 가 열린다(DEBUG_OAUTH_ENABLED 기본 true). 서버에서 카카오 인가코드를
      #     받으려면 필요하고, 닫으려면 .env 에 false 를 준다.
      #   - SQL·앱 로그가 DEBUG 다. 조용히 시키려면 .env 에 JPA_SHOW_SQL=false,
      #     LOG_LEVEL_SQL=INFO, LOG_LEVEL_APP=INFO 를 세트로 준다.
      #   - 커넥션 풀이 10 이다(prod 는 20). 늘리려면 .env 의 DB_POOL_SIZE.
      SPRING_PROFILES_ACTIVE: dev
      # DB 는 아래 postgres 서비스로 연결 (compose 네트워크 내 서비스명)
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mateon_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      TZ: Asia/Seoul
    ports:
      - "${APP_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    container_name: mateon-postgres
    restart: unless-stopped
    # 체크포인트·연결 로그 정도라 app 만큼 나오지는 않는다. 다만 무제한으로 두면 서버가
    # 오래 살아 있는 만큼 계속 쌓이므로 상한만 걸어 둔다 (총 30MB).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: mateon_db
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      TZ: Asia/Seoul
    # 외부에 DB 를 노출할 필요가 없다면 ports 블록은 주석 처리하세요(보안 권장).
    # ports:
      # - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - mateon-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d mateon_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mateon-pgadmin
    restart: unless-stopped
    # gunicorn 액세스 로그를 요청마다 찍는다. 여기서 볼 게 사실상 없어서 상한도 짜게 준다
    # (총 30MB). pgAdmin 을 안 쓰는 동안에도 헬스체크성 요청이 계속 남는다.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      # 접속 계정/비밀번호는 .env 로 오버라이드 권장 (기본값은 개발용).
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      TZ: Asia/Seoul
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - mateon-pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  mateon-postgres-data:
  mateon-pgadmin-data:
