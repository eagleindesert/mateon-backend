# 실제 자격증명을 넣지 않는다. 테스트 Compose의 ${...} 치환에만 사용한다.
# 앱에 전달할 값은 docker-compose-loadtest.yaml의 environment에 명시한다.
DOCKERHUB_USERNAME=eagleindesert
DOCKERHUB_IMAGE=mateon-backend
TAG=latest
APP_PLATFORM=linux/arm64
APP_PULL_POLICY=missing

APP_PORT=18081
LOADTEST_BIND_ADDRESS=127.0.0.1
DB_POOL_SIZE=10
LOG_LEVEL_APP=INFO

# 실제 모델 호출 없이 대기 시간을 재현한다. 밀리초 단위, 0이면 즉시 응답.
AI_STUB_DELAY_MS=0
