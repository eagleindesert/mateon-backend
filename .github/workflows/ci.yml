name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "올릴 자리. 아래 태그를 적으면 무시됩니다"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      tag:
        description: "이 태그부터 시작 (예: v1.1.0, v2.0.0). 비우면 위 자리만 올립니다"
        type: string
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Run tests
        run: ./gradlew test --no-daemon
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            build/reports/tests/test/
            build/test-results/test/
            build/reports/jacoco/
          retention-days: 7
          if-no-files-found: ignore

  # 현재 코드 × base src/test. 코드와 테스트를 같이 바꿔 침묵하는 회귀를 찾는다.
  # job 레벨 skip 은 required check 가 멈추거나 구멍이 생기므로, 우회·단축도 job 은 돌고 안에서 끝낸다.
  ab-regression:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Bypass on intentional-contract-break
        id: bypass
        env:
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'intentional-contract-break') }}
        run: |
          if [ "$HAS_LABEL" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            {
              echo "## ab-regression bypassed"
              echo "Label \`intentional-contract-break\` 가 있어 overlay 를 생략합니다. \`test\` 는 그대로 돕니다."
              echo "리뷰에서 테스트 삭제·완화가 그 의도와 맞는지 확인하세요."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check base CI is green
        if: steps.bypass.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          conclusion="$(gh run list --commit "$BASE_SHA" --workflow CI --limit 20 \
            --json conclusion,status,createdAt \
            --jq '[.[] | select(.status == "completed" and .conclusion != "")] | sort_by(.createdAt) | reverse | .[0].conclusion // empty')" \
            || {
              echo "Could not query CI runs for $BASE_SHA; not blocking overlay."
              echo "Base \`$BASE_SHA\` CI status unknown (query failed). Overlay continues." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            }
          echo "Base $BASE_SHA latest completed CI conclusion=${conclusion:-none}"
          case "$conclusion" in
            failure|cancelled|startup_failure|timed_out)
              {
                echo "## base-green failed"
                echo "Base \`$BASE_SHA\` CI conclusion is \`$conclusion\`. main 이 이미 빨간 상태입니다. overlay 를 돌리지 않습니다. main 을 고치세요."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
            "")
              echo "No completed CI run for $BASE_SHA; not blocking overlay."
              echo "Base \`$BASE_SHA\` 에 완료된 CI 가 없어 overlay 를 진행합니다." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "Base \`$BASE_SHA\` CI conclusion is \`$conclusion\`." >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac

      - uses: actions/checkout@v5
        if: steps.bypass.outputs.skip != 'true'

      - uses: actions/checkout@v5
        if: steps.bypass.outputs.skip != 'true'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: _ab_base

      - name: Short-circuit if tests unchanged
        id: short
        if: steps.bypass.outputs.skip != 'true'
        run: |
          set -euo pipefail
          if diff -rq src/test _ab_base/src/test >/dev/null 2>&1 \
            && diff -q build.gradle _ab_base/build.gradle >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            rm -rf _ab_base
            {
              echo "## ab-regression skipped"
              echo "\`src/test\` 와 \`build.gradle\` 이 base 와 같아 overlay 는 기존 \`test\` 와 같습니다. 생략합니다."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Overlay base src/test
        if: steps.bypass.outputs.skip != 'true' && steps.short.outputs.skip != 'true'
        run: |
          set -euo pipefail
          rm -rf src/test
          cp -a _ab_base/src/test src/test
          rm -rf _ab_base

      - uses: actions/setup-java@v5
        if: steps.bypass.outputs.skip != 'true' && steps.short.outputs.skip != 'true'
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Run overlay tests
        id: run
        if: steps.bypass.outputs.skip != 'true' && steps.short.outputs.skip != 'true'
        run: |
          set -euo pipefail
          chmod +x gradlew scripts/ci/ab-regression.sh
          set +e
          ./scripts/ci/ab-regression.sh
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          case "$rc" in
            0)
              echo "## ab-regression passed" >> "$GITHUB_STEP_SUMMARY"
              echo "예전 테스트가 현재 코드에서 통과했습니다." >> "$GITHUB_STEP_SUMMARY"
              ;;
            1)
              {
                echo "## REGRESSION"
                echo "예전 단언이 새 코드에서 깨졌습니다. 동작 회귀이거나, 의도된 계약 변경이면 라벨 \`intentional-contract-break\` 를 달고 테스트 diff 를 리뷰하세요."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            2)
              {
                echo "## INCOMPATIBLE"
                echo "예전 테스트가 새 시그니처/타입과 컴파일되지 않습니다. 비교 불능인 계약 파손입니다. 의도된 변경이면 라벨 \`intentional-contract-break\` 를 달세요."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              {
                echo "## compileJava failed"
                echo "새 코드가 컴파일되지 않았습니다. overlay 문제가 아니라 \`test\` job 과 같은 실패입니다. (exit $rc)"
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac
          exit "$rc"

      - name: Upload overlay test report
        if: always() && steps.run.conclusion != 'skipped' && steps.run.conclusion != ''
        uses: actions/upload-artifact@v4
        with:
          name: ab-regression-report
          path: |
            build/reports/tests/test/
            build/test-results/test/
          retention-days: 7
          if-no-files-found: ignore

  # test 와 ab-regression 의 AND. 브랜치 보호 required check 는 이 job 이름이다.
  # always() 가 없으면 한쪽 실패 시 이 job 이 skipped 가 되어 required check 가 멈춘다.
  pr-gate:
    if: always() && github.event_name == 'pull_request'
    needs: [test, ab-regression]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required jobs
        env:
          TEST: ${{ needs.test.result }}
          AB: ${{ needs.ab-regression.result }}
        run: |
          set -euo pipefail
          echo "test=$TEST"
          echo "ab-regression=$AB"
          {
            echo "## pr-gate"
            echo "- test: \`$TEST\`"
            echo "- ab-regression: \`$AB\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$TEST" = success ] && [ "$AB" = success ]; then
            exit 0
          fi
          exit 1

  docker:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Next DockerHub semver
        id: version
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          BUMP: ${{ github.event.inputs.bump }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          chmod +x scripts/docker/next-dockerhub-tag.sh
          ./scripts/docker/next-dockerhub-tag.sh
      - name: Show image tag
        run: echo "## Docker tag \`${{ steps.version.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/mateon-backend
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.tag }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
