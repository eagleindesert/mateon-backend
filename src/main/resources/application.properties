spring.application.name=mateon

# 로컬 개발 시 .env 파일에서 값을 읽어옵니다 (없으면 무시).
# Docker 환경에서는 docker-compose 의 env_file/environment 로 주입됩니다.
spring.config.import=optional:file:.env[.properties]

# Docker Compose 지원 (로컬 개발용 인프라 자동 기동)
# bootRun 시 compose-dev.yml 의 postgres/pgadmin 을 자동으로 up 하고,
# datasource 접속 정보는 postgres 서비스에서 자동 연결됩니다.
spring.docker.compose.file=docker-compose-dev.yml
spring.docker.compose.lifecycle-management=start_and_stop

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mateon_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}

# 커넥션 풀 (HikariCP)
# leak-detection-threshold: 이 시간 넘게 반납되지 않은 커넥션이 있으면 "빌려간 지점의 스택트레이스"를
#   경고 로그로 찍는다. 커넥션 누수는 증상(풀 고갈)만으로는 범인을 못 찾기 때문에 반드시 켜 둔다.
#   운영 중 커넥션을 실제로 오래 쓰는 정상 작업이 없으므로 오탐 부담도 없다.
spring.datasource.hikari.leak-detection-threshold=${DB_LEAK_DETECTION_MS:20000}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}

# JPA 설정
spring.jpa.show-sql=false
# open-in-view=false 는 필수다. true(기본값)면 EntityManager 가 요청이 끝날 때까지 살아 있는데,
# SSE 구독(/api/notifications/subscribe)은 최대 1시간짜리 async 요청이라 그동안 DB 커넥션이
# 풀로 돌아오지 않는다. 실제로 이것 때문에 커넥션 10개가 전부 묶여 로그인이 막힌 적이 있다.
# (끄는 데 따르는 지연로딩 위험은 없다 — 컨트롤러가 엔티티를 직접 반환하는 곳이 없고
#  DTO 조립이 전부 @Transactional 서비스 안에서 끝난다.)
spring.jpa.open-in-view=false
# 스키마는 Flyway 가 관리한다. Hibernate 는 엔티티↔실제 스키마 불일치를
# 부팅 시 검증만 하고(validate), 절대 스키마를 변경하지 않는다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true

# Flyway (DB 마이그레이션)
# baseline-on-migrate: 기존 데이터가 있는 DB(클라우드)는 V1 을 "이미 적용됨"으로
# 처리하고 V2 부터 실행한다. 빈 DB(로컬)는 V1 부터 전부 실행한다.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Mail 설정 (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# 타임아웃을 안 주면 JavaMail 기본값은 "무한 대기"다. SMTP 발송은 AFTER_COMMIT 리스너가
# 요청 스레드에서 수행하므로(VerificationCodeMailListener), Gmail 이 멈추면 그 스레드가
# 영영 돌아오지 않는다. 인증코드는 재요청이 가능하니 빨리 포기하는 편이 낫다.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# JWT 설정
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# AI 서버 (의도 추출/임베딩). 별도 FastAPI 서버 — POST /intents/extract 를 호출한다.
ai.base-url=${AI_BASE_URL:http://localhost:8000}
# AI 서버 인증용 공유 시크릿. 매 요청의 X-Internal-Secret 헤더로 보낸다. 필수 값이다.
# 주의: 기본값을 안 주는 것만으로는 부팅이 막히지 않는다. @ConfigurationProperties 바인딩은
#       해결 못 한 플레이스홀더를 원문 그대로 넣기 때문에, 실제 차단은 AiServerProperties
#       .validateInternalSecret() 이 한다.
ai.internal-secret=${AI_INTERNAL_SECRET}
# LLM+임베딩이라 응답이 수 초~수십 초 → read 는 넉넉히, connect 는 짧게.
# 포트폴리오 PDF 요약(/portfolios/summarize)은 최대 15페이지를 이미지로 렌더링해 한 번의 Vision
# 호출로 보내므로 기존 60s 로는 모자랄 수 있어 120s 로 잡는다. 이 값은 모든 AI 호출이 공유하지만
# 상한이지 지연이 아니라서 정상 응답 속도는 그대로다 — 연결 불가는 connect-timeout 이 먼저 잡으므로,
# 이 값을 올려서 실제로 더 기다리게 되는 건 AI 가 응답을 붙잡고 놓지 않는 드문 경우뿐이다.
ai.connect-timeout=${AI_CONNECT_TIMEOUT:5s}
ai.read-timeout=${AI_READ_TIMEOUT:120s}
# 이 시간 넘게 방치된 의도 추출 대화는 만료 처리하고 새로 시작한다.
ai.session-ttl=${AI_SESSION_TTL:24h}
# user_embeddings.embedding 이 vector(1536) 이므로 반드시 일치해야 한다.
ai.embedding-dimension=${AI_EMBEDDING_DIMENSION:1536}

# --- 파일 업로드 (공모전 포스터 이미지, 포트폴리오 PDF) ---
# Boot 기본값은 파일당 1MB 라 포스터 이미지가 그냥 막힌다. 업로드 기능 중 한도가 가장 큰 쪽
# (포트폴리오 PDF 20MB)에 맞춘다. request 쪽에 여유를 두는 건 멀티파트 경계/헤더 오버헤드 때문이다.
#
# 이건 컨테이너 레벨의 방어선일 뿐이고, 도메인별 한도는 각 서비스의 상수가 지킨다
# (EventExtractionService 10MB / PortfolioSummaryService 20MB). 여기를 올려도 포스터 이미지가
# 20MB 까지 통과하지는 않는다.
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:24MB}

# --- OCI Object Storage (S3 호환 API) ---
# Customer Secret Key 방식. 엔드포인트는 S3ClientConfig 가 namespace/region 으로 조립한다.
# ai.internal-secret 과 같은 이유로, 값 누락 차단은 ObjectStorageProperties.validate() 가 한다.
storage.namespace=${OCI_NAMESPACE}
storage.region=${OCI_REGION}
storage.bucket=${OCI_BUCKET}
storage.access-key=${OCI_S3_ACCESS_KEY}
storage.secret-key=${OCI_S3_SECRET_KEY}

# 버킷 총 사용량 상한. OCI 는 버킷 단위 쿼터를 제공하지 않아(콤파트먼트 단위만 있다) 앱이 직접
# 세고 막는다 — BucketCapacityGuard 참고. 0B 를 주면 검사를 끈다(무제한).
# 운영에서는 실제 여유보다 낮게 잡는다: 카운터가 인스턴스 메모리에 있어 그 차이가 완충이 된다.
# 예) Always Free 20GB 버킷 → OCI_BUCKET_MAX_BYTES=18GB
storage.max-bytes=${OCI_BUCKET_MAX_BYTES:2GB}
# 증분 카운터와 실제 버킷의 어긋남(덮어쓰기, 콘솔에서 직접 삭제 등)을 바로잡는 재실측 주기.
# 버킷 전체를 훑으므로 요청이 뜸한 시간대에 돌린다. 기동 직후에도 한 번 실행된다.
storage.usage-sync-cron=${OCI_BUCKET_USAGE_SYNC_CRON:0 30 4 * * *}

# --- API 문서 (springdoc-openapi) ---
# 응답 스키마를 DTO 에서 직접 생성한다. 손으로 쓴 명세는 코드와 별개 출처라 조용히 어긋나고,
# 실제로 docs/api-spec v7 에서 존재하지 않는 필드가 문서화된 적이 있다. 여기가 정본이다.
# 접근 허용은 SecurityConfig 가 이미 permitAll 로 열어 두고 있다.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
# 스키마 안에서 필드 순서를 DTO 선언 순서가 아닌 알파벳순으로 고정 — diff 가 안정된다.
springdoc.writer-with-order-by-keys=true
# UI 노출은 환경변수로 끌 수 있다. 운영에서 닫으려면 SWAGGER_UI_ENABLED=false 를 준다
# (/v3/api-docs 자체는 살아 있어 프론트가 스키마를 계속 받아볼 수 있다).
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:true}

# --- 리버스 프록시 뒤에서의 자기 주소 인식 ---
# 배포 환경은 nginx 가 경로 프리픽스(/<토큰>)를 떼고 8080 으로 넘긴다. 이 설정이 없으면 앱은
# 자기가 그 프리픽스 아래에 있다는 걸 모르고, X-Forwarded-Proto 도 무시해 스킴까지 http 로 본다.
#
# 일반 REST 엔드포인트는 URL 을 만들지 않고 받기만 해서 아무 문제가 없다. 반면 springdoc 은
# 브라우저가 다시 요청할 URL 을 서버가 생성해 내려주므로(swagger-config 의 url,
# oauth2RedirectUrl, servers, /swagger-ui.html 의 302 Location) 여기서 전부 프리픽스가 빠진다.
# 그 결과 Swagger UI 가 명세 대신 404 HTML 을 받아 "valid version field" 오류를 띄웠다.
#
# 주의: 이 설정만으로는 부족하다. nginx 가 실제로 헤더를 보내야 한다 —
#   proxy_set_header X-Forwarded-Prefix /<프리픽스>;
#   proxy_set_header X-Forwarded-Proto  $scheme;
# 둘 중 하나만 있으면 동작하지 않는다. 프리픽스가 없는 환경(로컬)에서는 헤더가 안 오므로
# 켜 두어도 동작이 달라지지 않는다.
server.forward-headers-strategy=framework

# --- 협업 온도 ---
# 활동 종료 후 팀원 평가를 받는 기간. 지나면 제출이 거부된다.
# 기억이 희미해진 뒤의 평가는 잡음이 크고, 창구가 계속 열려 있으면 보복 평가에 쓰인다.
collaboration.review-window-days=${COLLABORATION_REVIEW_WINDOW_DAYS:14}
# 공모전 마감일이 지난 팀을 자동 종료하는 배치. 평가 기간이 2주라 하루 한 번으로 충분하다.
collaboration.auto-complete-cron=${COLLABORATION_AUTO_COMPLETE_CRON:0 0 3 * * *}
