# 개발 프로필.
# ------------------------------------------------------------------------------
# SPRING_PROFILES_ACTIVE 를 주지 않으면 이 프로필이다 (application.yml 의 spring.profiles.default).
# 즉 bootRun / IDE 실행은 아무 설정 없이 여기로 온다.
#
# "로컬 전용"이 아니다 — 운영 환경이 아직 없어서 배포돼 있는 서버도 이 프로필로 돈다
# (docker-compose-deployment.yml). 그래서 로그·SQL 처럼 서버에서 부담이 되는 항목은
# 프로필을 갈아끼우지 않고도 끌 수 있게 .env 스위치를 달아 뒀다.
#
# 여기 있는 값은 전부 "환경이 달라서" 다른 것들이다. 도메인 규칙(평가 기간, 임베딩 차원 등)이나
# 시크릿은 application.yml 과 .env 가 계속 맡는다 — 프로필 파일에 시크릿을 넣지 않는다.
# ------------------------------------------------------------------------------
spring:
  # bootRun 시 docker-compose.yml 의 postgres/pgadmin 을 자동으로 up 하고, datasource 접속
  # 정보는 postgres 서비스에서 자동 연결된다. 앱 종료 시 stop 까지 한다(start_and_stop).
  #
  # 파일 경로는 지정하지 않는다 — docker-compose.yml 은 Boot 이 작업 디렉터리에서 자동 탐지하는
  # 기본 이름이다. 같은 파일의 app 서비스는 "app" 프로파일에 묶여 있어 여기서 함께 뜨지 않는다
  # (앱은 Gradle 이 실행하므로 포트가 겹친다).
  #
  # prod 에는 대응 항목이 없다. spring-boot-docker-compose 가 developmentOnly 의존성이라
  # 배포 JAR 에 애초에 들어가지 않고, 런타임 이미지 안에는 compose 파일도 docker CLI 도 없다.
  docker:
    compose:
      lifecycle-management: start_and_stop

  datasource:
    # 커넥션 풀 (HikariCP)
    # leak-detection-threshold: 이 시간 넘게 반납되지 않은 커넥션이 있으면 "빌려간 지점의
    #   스택트레이스"를 경고 로그로 찍는다. 커넥션 누수는 증상(풀 고갈)만으로는 범인을 못 찾기
    #   때문에 반드시 켜 둔다. 커넥션을 실제로 오래 쓰는 정상 작업이 없으므로 오탐 부담도 없다.
    # 로컬은 나 혼자 쓰는 컨테이너 하나라 풀을 크게 잡을 이유가 없다.
    hikari:
      leak-detection-threshold: "${DB_LEAK_DETECTION_MS:20000}"
      maximum-pool-size: "${DB_POOL_SIZE:10}"

  jpa:
    # SQL 로그 스위치. 프로필은 기본값만 정하고 실제 on/off 는 .env 가 쥔다 —
    # 지금 배포돼 있는 서버도 이 프로필로 도는데, 거기서는 SQL 이 컨테이너 로그로 그대로
    # 쌓이기 때문에 프로필을 바꾸지 않고 끌 수단이 필요하다.
    #
    # 기본값은 꺼짐이다. 예전에는 로컬 편의로 켜 두었는데, 같은 프로필로 도는 배포 서버가
    # 그 기본값을 그대로 물려받아 쿼리를 컨테이너 로그에 계속 쌓았다. 켜고 싶은 쪽(로컬에서
    # 쿼리를 들여다볼 때)이 .env 로 켜는 편이 사고가 적다.
    #
    # 이름을 SPRING_JPA_SHOW_SQL 이 아니라 JPA_SHOW_SQL 로 둔 건 나머지 설정
    # (DB_POOL_SIZE, SWAGGER_UI_ENABLED …)과 같은 규칙을 쓰기 위해서다.
    #
    # 주의: 이 스위치는 System.out 으로 나가는 쪽만 연다. 같은 SQL 을 org.hibernate.SQL
    # 로거도 찍으므로(아래 logging.level), 실제로 보려면 LOG_LEVEL_SQL 과 짝으로 준다.
    show-sql: "${JPA_SHOW_SQL:false}"
    properties:
      hibernate:
        # 줄바꿈·들여쓰기 정렬. show-sql 과 따로 켤 이유가 없어 같은 스위치를 본다.
        format_sql: "${JPA_SHOW_SQL:false}"

# 허용 오리진 (REST + STOMP 핸드셰이크 공통, CorsProperties 가 읽는다).
#
# 로컬은 오리진이 일정하지 않다 — file:// 로 연 chat-client.js, 포트가 매번 바뀌는 Vite,
# 스크립트가 임의 Origin 헤더로 보내는 preflight 점검까지 있다. 그래서 기본이 전체 허용이고,
# 이건 예전 debug.enabled=true 가 주던 동작 그대로다.
# 특정 오리진만으로 좁혀 시험하려면 .env 에 CORS_ALLOWED_ORIGINS 를 준다.
cors:
  allowed-origins: "${CORS_ALLOWED_ORIGINS:*}"

# 디버그 기능 스위치. 프로필이 기본값만 정하고, 켜고 끄는 건 환경변수로 언제든 뒤집을 수 있다.
#
# 중첩이 아니라 평평한 키로 적는다 — Spring Boot 의 예약 프로퍼티 debug(boolean)와 자리가
# 겹쳐서, 여기에 매핑을 두면 에디터가 타입 충돌로 잡는다. 해석 방식은 두 표기가 같다.
# 카카오 인가코드 수신용 로컬 컨트롤러(OAuthDebugController)를 빈으로 등록한다.
# false 면 @ConditionalOnProperty 에 걸려 미등록 → /debug/** 는 404 다.
debug.oauth.enabled: "${DEBUG_OAUTH_ENABLED:true}"

logging:
  level:
    # 레벨도 .env 로 뒤집을 수 있게 뚫어 둔다. 앱 로그는 DEBUG 로 두지만(우리 코드라 양이
    # 통제된다), SQL 로거는 show-sql 과 같이 기본을 닫는다 — 배포된 서버가 이 프로필로 도는
    # 동안 DEBUG 로 두면 컨테이너 로그가 빠르게 커진다.
    #
    # 로컬에서 쿼리를 보려면 .env 에 둘을 세트로 준다:
    #   JPA_SHOW_SQL=true
    #   LOG_LEVEL_SQL=DEBUG
    com.example.mateon: "${LOG_LEVEL_APP:DEBUG}"
    org.hibernate.SQL: "${LOG_LEVEL_SQL:INFO}"
    # 바인딩 파라미터(? 자리에 실제로 들어간 값)까지 보려면 아래 주석을 푼다.
    # 평소에는 로그가 읽을 수 없을 만큼 길어진다.
    # org.hibernate.orm.jdbc.bind: TRACE

springdoc:
  swagger-ui:
    enabled: "${SWAGGER_UI_ENABLED:true}"
