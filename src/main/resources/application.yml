spring:
  application:
    name: mateon

  # 프로필은 "환경"만 가른다 — dev(로컬)와 prod(배포) 둘뿐이다. 디버그 기능은 프로필이 아니라
  # debug.* 스위치가 맡는데, 운영에서 잠깐 디버그를 켜자고 프로필을 바꾸면 CORS·로그·커넥션 풀까지
  # 통째로 딸려 오기 때문이다. 두 축은 서로 직교한다.
  #
  # 아무것도 주지 않으면 dev 다 — bootRun/IDE 실행이 무설정으로 돌아야 하고, 배포는
  # docker-compose-deployment.yml 이 SPRING_PROFILES_ACTIVE=prod 를 명시하므로 헷갈릴 일이 없다.
  profiles:
    default: dev

  # 로컬 개발 시 .env 파일에서 값을 읽어옵니다 (없으면 무시).
  # Docker 환경에서는 docker-compose 의 env_file/environment 로 주입됩니다.
  # 대괄호가 YAML 의 flow 시퀀스로 해석되지 않도록 따옴표로 감싼다.
  config:
    import: "optional:file:.env[.properties]"

  # Docker Compose 지원(로컬 인프라 자동 기동)은 application-dev.yml 로 옮겼다.
  # spring-boot-docker-compose 가 developmentOnly 의존성이라 배포 JAR 에는 아예 없다.

  datasource:
    driver-class-name: org.postgresql.Driver
    url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mateon_db}"
    username: "${SPRING_DATASOURCE_USERNAME:admin}"
    password: "${SPRING_DATASOURCE_PASSWORD:admin}"

    # 커넥션 풀(HikariCP) 설정은 프로필별로 나뉜다 — application-dev.yml / application-prod.yml.
    # 풀 크기가 환경마다 다르고(로컬은 Postgres 컨테이너 하나), 그 옆에 붙는 누수 감지 주석도
    # 같이 옮겨 뒀다.

  # JPA 설정
  # show-sql / format_sql 은 프로필별로 나뉜다 (dev 만 켠다).
  jpa:
    # open-in-view=false 는 필수다. true(기본값)면 EntityManager 가 요청이 끝날 때까지 살아 있는데,
    # SSE 구독(/api/notifications/subscribe)은 최대 notification.sse-timeout(기본 1시간)짜리
    # async 요청이라 그동안 DB 커넥션이
    # 풀로 돌아오지 않는다. 실제로 이것 때문에 커넥션 10개가 전부 묶여 로그인이 막힌 적이 있다.
    # (끄는 데 따르는 지연로딩 위험은 없다 — 컨트롤러가 엔티티를 직접 반환하는 곳이 없고
    #  DTO 조립이 전부 @Transactional 서비스 안에서 끝난다.)
    open-in-view: false
    hibernate:
      # 스키마는 Flyway 가 관리한다. Hibernate 는 엔티티↔실제 스키마 불일치를
      # 부팅 시 검증만 하고(validate), 절대 스키마를 변경하지 않는다.
      ddl-auto: validate

  # Flyway (DB 마이그레이션)
  # baseline-on-migrate: 기존 데이터가 있는 DB(클라우드)는 V1 을 "이미 적용됨"으로
  # 처리하고 V2 부터 실행한다. 빈 DB(로컬)는 V1 부터 전부 실행한다.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  # Mail 설정 (Gmail SMTP)
  mail:
    host: smtp.gmail.com
    port: 587
    username: "${MAIL_USERNAME}"
    password: "${MAIL_PASSWORD}"
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # 타임아웃을 안 주면 JavaMail 기본값은 "무한 대기"다. SMTP 발송은 AFTER_COMMIT 리스너가
          # 요청 스레드에서 수행하므로(VerificationCodeMailListener), Gmail 이 멈추면 그 스레드가
          # 영영 돌아오지 않는다. 인증코드는 재요청이 가능하니 빨리 포기하는 편이 낫다.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # --- 파일 업로드 (공모전 포스터 이미지, 포트폴리오 PDF) ---
  # Boot 기본값은 파일당 1MB 라 포스터 이미지가 그냥 막힌다. 업로드 기능 중 한도가 가장 큰 쪽
  # (포트폴리오 PDF 20MB)에 맞춘다. request 쪽에 여유를 두는 건 멀티파트 경계/헤더 오버헤드 때문이다.
  #
  # 이건 컨테이너 레벨의 방어선일 뿐이고, 도메인별 한도는 각 서비스의 상수가 지킨다
  # (EventExtractionService 10MB / PortfolioSummaryService 20MB). 여기를 올려도 포스터 이미지가
  # 20MB 까지 통과하지는 않는다.
  servlet:
    multipart:
      max-file-size: "${MULTIPART_MAX_FILE_SIZE:20MB}"
      max-request-size: "${MULTIPART_MAX_REQUEST_SIZE:24MB}"

  # --- Spring AI (AI 게이트웨이의 도메인 분류 전용) ---
  # 이 프로젝트의 다른 AI 작업(의도 추출/임베딩/요약)은 전부 외부 FastAPI 가 한다. 여기만
  # Spring 이 직접 LLM 을 부르는 이유는 "어느 도메인이냐"를 FastAPI 에 붙기 전에 정해야 해서다.
  ai:
    openai:
      # 키가 없어도 앱은 떠야 한다 — 라우터는 실패 시 기존 동작(매칭으로 통과)으로 폴백하도록
      # 설계돼 있고, 키 없는 로컬/CI 에서 부팅이 막히면 그 폴백을 시험할 수조차 없다.
      # 그래서 AiServerProperties 처럼 @PostConstruct 로 막지 않고 빈 기본값을 준다.
      api-key: "${OPENAI_API_KEY:}"
      chat:
        model: "${AI_ROUTER_MODEL:gpt-5-mini}"
        # temperature 를 일부러 안 준다. 분류는 매번 같은 답이 나와야 하니 0 을 주고 싶지만,
        # gpt-5 계열은 Chat Completions 에서 기본값(1) 외의 값을 거부한다:
        #   400 Unsupported value: 'temperature' does not support 0 with this model.
        # 그리고 이 400 은 재시도 대상이 아니라서 AiRouterClient 가 조용히 폴백한다 —
        # 라우터가 켜져 있는데도 모든 발화가 매칭으로 가고, 로그는 키가 없을 때(401)와
        # 똑같이 찍혀서 설정 오류를 알아챌 단서가 없다. 그래서 안 보내는 게 맞다.
        #
        # 프로퍼티가 @Nullable Double 이고 기본값이 없어서, 이 줄을 지우면 요청 본문에
        # temperature 자체가 실리지 않는다. 결정성은 RouteDecision 스키마 강제와
        # 시스템 프롬프트가 맡고, enum 밖의 값이 오면 어차피 폴백한다.
        # temperature 를 꼭 고정해야 하면 AI_ROUTER_MODEL 로 gpt-4.1-mini 등을 쓴다.
    retry:
      # Spring AI 기본값이 max-attempts=10, backoff 최대 3분이다. 이건 요청 경로 위에 있는
      # 분류 한 번이고 그 뒤에 FastAPI 호출이 또 있어서, 그대로 두면 사용자가 몇 분을 기다린다.
      # 어차피 실패하면 폴백이라 빨리 포기하는 편이 낫다.
      #
      # 다만 Spring AI 2.0 의 OpenAI 연동은 이 값을 쓰지 않는다 — RetryTemplate 을 거치지 않고
      # 공식 OpenAI Java SDK 가 자체 재시도를 한다. 실제 노브는 spring.ai.openai.max-retries
      # (기본 3) 이고, 401/400 처럼 재시도해도 소용없는 응답은 SDK 가 알아서 한 번에 포기한다.
      max-attempts: 2

# --- AI 게이트웨이 (도메인 라우터) ---
airouter:
  # 끄면 분류를 건너뛰고 곧장 매칭 의도 추출로 통과시킨다 (= 게이트웨이 도입 전 동작).
  # OPENAI_API_KEY 가 없는 환경에서 켜 두어도 결과는 같다 — 라우터가 폴백할 뿐이다.
  enabled: "${AI_ROUTER_ENABLED:true}"

# JWT 설정
jwt:
  secret: "${JWT_SECRET}"
  expiration: "${JWT_EXPIRATION:86400000}"
  refresh-expiration: "${JWT_REFRESH_EXPIRATION:604800000}"

# AI 서버 (의도 추출/임베딩). 별도 FastAPI 서버 — POST /intents/extract 를 호출한다.
ai:
  base-url: "${AI_BASE_URL:http://localhost:8000}"
  # AI 서버 인증용 공유 시크릿. 매 요청의 X-Internal-Secret 헤더로 보낸다. 필수 값이다.
  # 주의: 기본값을 안 주는 것만으로는 부팅이 막히지 않는다. @ConfigurationProperties 바인딩은
  #       해결 못 한 플레이스홀더를 원문 그대로 넣기 때문에, 실제 차단은 AiServerProperties
  #       .validateInternalSecret() 이 한다.
  internal-secret: "${AI_INTERNAL_SECRET}"
  # LLM+임베딩이라 응답이 수 초~수십 초 → read 는 넉넉히, connect 는 짧게.
  # 포트폴리오 PDF 요약(/portfolios/summarize)은 최대 15페이지를 이미지로 렌더링해 한 번의 Vision
  # 호출로 보내므로 기존 60s 로는 모자랄 수 있어 120s 로 잡는다. 이 값은 모든 AI 호출이 공유하지만
  # 상한이지 지연이 아니라서 정상 응답 속도는 그대로다 — 연결 불가는 connect-timeout 이 먼저 잡으므로,
  # 이 값을 올려서 실제로 더 기다리게 되는 건 AI 가 응답을 붙잡고 놓지 않는 드문 경우뿐이다.
  connect-timeout: "${AI_CONNECT_TIMEOUT:5s}"
  read-timeout: "${AI_READ_TIMEOUT:120s}"
  # 이 시간 넘게 방치된 의도 추출 대화는 만료 처리하고 새로 시작한다.
  session-ttl: "${AI_SESSION_TTL:24h}"
  # user_embeddings.embedding 이 vector(1536) 이므로 반드시 일치해야 한다.
  embedding-dimension: "${AI_EMBEDDING_DIMENSION:1536}"

# --- OCI Object Storage (S3 호환 API) ---
# Customer Secret Key 방식. 엔드포인트는 S3ClientConfig 가 namespace/region 으로 조립한다.
# ai.internal-secret 과 같은 이유로, 값 누락 차단은 ObjectStorageProperties.validate() 가 한다.
storage:
  namespace: "${OCI_NAMESPACE}"
  region: "${OCI_REGION}"
  bucket: "${OCI_BUCKET}"
  access-key: "${OCI_S3_ACCESS_KEY}"
  secret-key: "${OCI_S3_SECRET_KEY}"

  # 버킷 총 사용량 상한. OCI 는 버킷 단위 쿼터를 제공하지 않아(콤파트먼트 단위만 있다) 앱이 직접
  # 세고 막는다 — BucketCapacityGuard 참고. 0B 를 주면 검사를 끈다(무제한).
  # 운영에서는 실제 여유보다 낮게 잡는다: 카운터가 인스턴스 메모리에 있어 그 차이가 완충이 된다.
  # 예) Always Free 20GB 버킷 → OCI_BUCKET_MAX_BYTES=18GB
  max-bytes: "${OCI_BUCKET_MAX_BYTES:2GB}"
  # 증분 카운터와 실제 버킷의 어긋남(덮어쓰기, 콘솔에서 직접 삭제 등)을 바로잡는 재실측 주기.
  # 버킷 전체를 훑으므로 요청이 뜸한 시간대에 돌린다. 기동 직후에도 한 번 실행된다.
  # 크론식의 * 가 YAML 앵커로 읽히지 않도록 따옴표로 감싼다.
  usage-sync-cron: "${OCI_BUCKET_USAGE_SYNC_CRON:0 30 4 * * *}"

# --- 알림 (SSE) ---
notification:
  # 알림 구독(/api/notifications/subscribe) 연결의 수명. 이 시간이 지나면 서버가 연결을 닫고
  # 브라우저 EventSource 가 곧바로 재연결한다(끊긴 동안 발생한 알림은 목록 조회로 따라잡는다).
  #
  # 앞단 nginx 의 proxy_read_timeout 보다 짧게 두는 게 좋다. 더 길면 프록시가 먼저 연결을 끊어
  # 서버는 죽은 emitter 를 남은 시간만큼 붙들고 있게 된다. 현재 nginx 는 3600s 라 같은 값인데,
  # 정확히 같으면 누가 먼저 끊을지가 경합이므로 여유를 두려면 여기를 55m 등으로 낮춘다.
  sse-timeout: "${NOTIFICATION_SSE_TIMEOUT:1h}"

# --- API 문서 (springdoc-openapi) ---
# 응답 스키마를 DTO 에서 직접 생성한다. 손으로 쓴 명세는 코드와 별개 출처라 조용히 어긋나고,
# 실제로 docs/api-spec v7 에서 존재하지 않는 필드가 문서화된 적이 있다. 여기가 정본이다.
# 접근 허용은 SecurityConfig 가 이미 permitAll 로 열어 두고 있다.
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    # UI 노출 여부(enabled)는 프로필별로 나뉜다 — application-dev.yml / application-prod.yml.
    # 어느 쪽이든 SWAGGER_UI_ENABLED 로 덮을 수 있고, /v3/api-docs 자체는 이 값과 무관하게
    # 계속 살아 있어 프론트가 스키마를 받아볼 수 있다.
  # 스키마 안에서 필드 순서를 DTO 선언 순서가 아닌 알파벳순으로 고정 — diff 가 안정된다.
  writer-with-order-by-keys: true

# --- 리버스 프록시 뒤에서의 자기 주소 인식 ---
# 배포 환경은 nginx 가 경로 프리픽스(/<토큰>)를 떼고 8080 으로 넘긴다. 이 설정이 없으면 앱은
# 자기가 그 프리픽스 아래에 있다는 걸 모르고, X-Forwarded-Proto 도 무시해 스킴까지 http 로 본다.
#
# 일반 REST 엔드포인트는 URL 을 만들지 않고 받기만 해서 아무 문제가 없다. 반면 springdoc 은
# 브라우저가 다시 요청할 URL 을 서버가 생성해 내려주므로(swagger-config 의 url,
# oauth2RedirectUrl, servers, /swagger-ui.html 의 302 Location) 여기서 전부 프리픽스가 빠진다.
# 그 결과 Swagger UI 가 명세 대신 404 HTML 을 받아 "valid version field" 오류를 띄웠다.
#
# 주의: 이 설정만으로는 부족하다. nginx 가 실제로 헤더를 보내야 한다 —
#   proxy_set_header X-Forwarded-Prefix /<프리픽스>;
#   proxy_set_header X-Forwarded-Proto  $scheme;
# 둘 중 하나만 있으면 동작하지 않는다. 프리픽스가 없는 환경(로컬)에서는 헤더가 안 오므로
# 켜 두어도 동작이 달라지지 않는다.
server:
  forward-headers-strategy: framework

# --- 협업 온도 ---
collaboration:
  # 활동 종료 후 팀원 평가를 받는 기간. 지나면 제출이 거부된다.
  # 기억이 희미해진 뒤의 평가는 잡음이 크고, 창구가 계속 열려 있으면 보복 평가에 쓰인다.
  review-window-days: "${COLLABORATION_REVIEW_WINDOW_DAYS:14}"
  # 공모전 마감일이 지난 팀을 자동 종료하는 배치. 평가 기간이 2주라 하루 한 번으로 충분하다.
  # 크론식의 * 가 YAML 앵커로 읽히지 않도록 따옴표로 감싼다.
  auto-complete-cron: "${COLLABORATION_AUTO_COMPLETE_CRON:0 0 3 * * *}"
