# 배포 프로필.
# ------------------------------------------------------------------------------
# docker-compose-deployment.yml 의 app 서비스가 SPRING_PROFILES_ACTIVE=prod 로 켠다.
#
# 주의 — 이 파일의 값은 서버 .env 에 이길 수 없다. Spring 의 설정 우선순위에서 OS 환경변수가
# 프로필 yml 보다 높은데, 배포 compose 는 env_file 로 .env 의 모든 키를 환경변수로 주입한다.
# 그래서 아래 항목을 서버에서 통제하려면 .env 에 "여기서 정한 이름"(CORS_ALLOWED_ORIGINS,
# DEBUG_OAUTH_ENABLED 등)으로 넣어야 하고, 반대로 서버 .env 에 debug.oauth.enabled 같은
# 옛 이름이 남아 있으면 이 파일이 무력해진다.
# ------------------------------------------------------------------------------
spring:
  # 배포 JAR 에는 spring-boot-docker-compose 가 애초에 없다(developmentOnly). 그런데도 이 줄이
  # 필요한 건 로컬에서 `SPRING_PROFILES_ACTIVE=prod ./gradlew bootRun` 으로 스모크를 돌릴 때다 —
  # bootRun 은 그 모듈을 클래스패스에 올리고, docker.compose 지원은 lifecycle-management 를
  # 안 줘도 enabled 기본값(true)만으로 켜진다. 그러면 prod 를 시험하는데 로컬 compose 가 딸려 온다.
  docker:
    compose:
      enabled: false

  datasource:
    # leak-detection-threshold 의 취지는 dev 와 같다(반납 안 된 커넥션의 스택트레이스를 찍는다).
    # 운영은 동시 요청이 겹치므로 풀을 더 크게 잡는다.
    hikari:
      leak-detection-threshold: "${DB_LEAK_DETECTION_MS:20000}"
      maximum-pool-size: "${DB_POOL_SIZE:20}"

  jpa:
    # 운영 로그에 쿼리를 흘리지 않는다. 양도 문제지만 WHERE 절에 실린 값이 그대로 남는다.
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# 허용 오리진 (REST + STOMP 핸드셰이크 공통, CorsProperties 가 읽는다).
#
# 일부러 기본값을 주지 않는다. 전체 허용으로 조용히 뜨는 것보다 부팅이 막히는 편이 낫다 —
# allowCredentials(true) 와 "*" 의 조합은 아무 사이트나 로그인된 사용자 자격으로 이 API 를
# 호출할 수 있다는 뜻이다.
#
# 다만 기본값을 비우는 것만으로는 부팅이 안 막힌다. @ConfigurationProperties 바인딩은 해결 못 한
# 플레이스홀더를 원문 그대로 넣기 때문에(ai.internal-secret 과 같은 함정), 실제 차단은
# CorsProperties.validateAllowedOrigins() 가 한다.
#
# 서버 .env 예)
#   CORS_ALLOWED_ORIGINS=https://mateon.example.com,https://www.mateon.example.com
cors:
  allowed-origins: "${CORS_ALLOWED_ORIGINS}"

# 디버그 기능 스위치. 운영 기본은 꺼짐이고, 필요할 때 서버 .env 로 잠깐 켰다 되돌린다
# (프로필을 바꾸는 것과 달리 CORS·로그·풀 설정은 건드리지 않는다).
#
# 중첩(debug: → oauth: → enabled:)이 아니라 평평한 키로 적는다. Spring Boot 에 debug 라는
# 예약 프로퍼티가 이미 있어서(자동설정 리포트 on/off, boolean) 같은 자리에 매핑을 두면
# 에디터가 타입 충돌로 잡는다. 값이 해석되는 방식은 두 표기가 완전히 같다.
# 카카오 인가코드 수신용 로컬 컨트롤러. false 면 빈이 등록되지 않아 /debug/** 는 404 다.
debug.oauth.enabled: "${DEBUG_OAUTH_ENABLED:false}"

logging:
  level:
    root: INFO
    com.example.mateon: INFO

springdoc:
  swagger-ui:
    # 현재 프론트가 Swagger UI 를 명세 대신 보고 있어 기본은 열어 둔다.
    # 닫으려면 서버 .env 에 SWAGGER_UI_ENABLED=false — /v3/api-docs 는 그래도 살아 있다.
    enabled: "${SWAGGER_UI_ENABLED:true}"
