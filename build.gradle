plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.security:spring-security-test'
	// 통합 테스트용 일회용 Postgres. 개발 DB 에 붙으면 크롤러가 데이터를 넣을 때마다 테스트가
	// 깨지고 CI 에서는 아예 못 돈다. @ServiceConnection 이 컨테이너 접속 정보를 자동 주입한다.
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // pgvector 지원. @JdbcTypeCode(SqlTypes.VECTOR) + float[] 매핑은 이 모듈이 있어야 동작한다.
    // (없으면 Hibernate 가 float[] 를 bytea 로 보내 "column is of type vector but
    //  expression is of type bytea" 로 실패한다. UserEmbedding/TeamEmbedding 이 이걸 쓴다)
    implementation 'org.hibernate.orm:hibernate-vector'
    // DB 마이그레이션 (스키마 버전 관리). 로컬/클라우드 스키마 일치 보장.
    // Spring Boot 4 는 자동설정이 모듈별로 분리되어, Flyway 연동은 spring-boot-flyway
    // 모듈이 있어야 활성화된다. (flyway-core 만으로는 자동설정이 동작하지 않음)
    implementation 'org.springframework.boot:spring-boot-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    // API 명세 자동 생성. 버전 라인을 Spring Boot 에 맞춰야 한다 — springdoc 2.x 는 Boot 3
    // (Spring Framework 6 + Jackson 2) 전용이라 Boot 4 에서 /v3/api-docs 가 500 으로 떨어진다.
    // 3.0.x 가 Boot 4.0.x 라인이다 (3.1.x 는 Boot 4.1 대상이므로 올리지 말 것).
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
	// OCI Object Storage 업로드 (S3 호환 API + Customer Secret Key).
	// OCI 네이티브 SDK 대신 AWS S3 SDK 를 쓰는 이유: S3 호환 API 는 access/secret key 만으로
	// 인증되어 ~/.oci/config 와 개인키 PEM 을 컨테이너에 배포할 필요가 없다.
	implementation platform('software.amazon.awssdk:bom:2.32.4')
	implementation 'software.amazon.awssdk:s3'
	// 로컬 개발 시 bootRun 하면 docker compose 를 자동 기동 (배포 JAR 에는 미포함)
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
}

tasks.named('test') {
	useJUnitPlatform()
}

// 개발 루프용 단축 태스크. Docker(Testcontainers)가 필요한 테스트만 빼고 돌린다 —
// 단위/컨트롤러 테스트 수백 건이 컨테이너 기동을 기다리지 않게 하려는 것뿐이고,
// 관문은 여전히 `./gradlew test` 다 (이 태스크는 check 에 걸지 않는다).
// 별도 태그가 필요 없는 이유: Docker 를 쓰는 클래스는 이미 *IntegrationTest 로 명명돼 있다.
tasks.register('fastTest', Test) {
	group = 'verification'
	description = 'Docker 없이 돌아가는 테스트만 실행한다 (통합 테스트 제외).'
	useJUnitPlatform()
	filter {
		excludeTestsMatching '*IntegrationTest'
		excludeTestsMatching 'com.example.mateon.MateonBackendApplicationTests'
	}
}
