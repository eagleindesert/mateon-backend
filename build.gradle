plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.0.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

// lombok.config 는 소스도 리소스도 아니라, 안 적으면 설정만 바꾸고 클래스가
// 그대로라 @lombok.Generated 가 안 붙는다.
tasks.named('compileJava') {
	inputs.file('lombok.config')
}

jacoco {
	toolVersion = '0.8.15'
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.security:spring-security-test'
	// 통합 테스트용 일회용 Postgres. 개발 DB 에 붙으면 크롤러가 데이터를 넣을 때마다 테스트가
	// 깨지고 CI 에서는 아예 못 돈다. @ServiceConnection 이 컨테이너 접속 정보를 자동 주입한다.
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // pgvector 지원. @JdbcTypeCode(SqlTypes.VECTOR) + float[] 매핑은 이 모듈이 있어야 동작한다.
    // (없으면 Hibernate 가 float[] 를 bytea 로 보내 "column is of type vector but
    //  expression is of type bytea" 로 실패한다. UserEmbedding/TeamEmbedding 이 이걸 쓴다)
    implementation 'org.hibernate.orm:hibernate-vector'
    // DB 마이그레이션 (스키마 버전 관리). 로컬/클라우드 스키마 일치 보장.
    // Spring Boot 4 는 자동설정이 모듈별로 분리되어, Flyway 연동은 spring-boot-flyway
    // 모듈이 있어야 활성화된다. (flyway-core 만으로는 자동설정이 동작하지 않음)
    implementation 'org.springframework.boot:spring-boot-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    // API 명세 자동 생성. 버전 라인을 Spring Boot 에 맞춰야 한다 — springdoc 2.x 는 Boot 3
    // (Spring Framework 6 + Jackson 2) 전용이라 Boot 4 에서 /v3/api-docs 가 500 으로 떨어진다.
    // 3.0.x 가 Boot 4.0.x 라인이다 (3.1.x 는 Boot 4.1 대상이므로 올리지 말 것).
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
	// OCI Object Storage 업로드 (S3 호환 API + Customer Secret Key).
	// OCI 네이티브 SDK 대신 AWS S3 SDK 를 쓰는 이유: S3 호환 API 는 access/secret key 만으로
	// 인증되어 ~/.oci/config 와 개인키 PEM 을 컨테이너에 배포할 필요가 없다.
	implementation platform('software.amazon.awssdk:bom:2.32.4')
	implementation 'software.amazon.awssdk:s3'
	// AI 게이트웨이(도메인 분류)용 LLM 호출. 이 프로젝트의 다른 AI 작업은 전부 외부 FastAPI 가
	// 하지만, 라우팅 판단만은 Spring 이 직접 한다 — FastAPI 에 붙기 전에 결정해야 하는 일이다.
	//
	// 버전 라인을 Spring Boot 에 맞춰야 한다 — Spring AI 1.x 는 Boot 3 전용이고 2.0 부터가
	// Boot 4(Spring Framework 7 + Jackson 3) 라인이다.
	implementation platform('org.springframework.ai:spring-ai-bom:2.0.0')
	implementation 'org.springframework.ai:spring-ai-starter-model-openai'
	// 로컬 개발 시 bootRun 하면 docker compose 를 자동 기동 (배포 JAR 에는 미포함)
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
}

tasks.named('test') {
	useJUnitPlatform()
	// *LiveTest 는 밖에 떠 있는 ai-stub 을 상대한다. 스텁이 없으면 스스로 skip 하지만,
	// 관문에서 매번 "건너뜀" 수십 건을 보고할 이유가 없어 이름으로 빼 둔다.
	// (fastTest 의 *IntegrationTest 제외와 방향이 반대다 — 저쪽은 test 에서는 돈다)
	filter {
		excludeTestsMatching '*LiveTest'
	}
	// 커버리지는 관문과 같은 집합만 잰다. dependsOn 을 걸면 테스트 실패 시
	// 리포트가 SKIPPED 가 되므로, 실패 후에도 남기려면 finalizedBy 만 쓴다.
	finalizedBy tasks.named('jacocoTestReport')
}

// 개발 루프용 단축 태스크. Docker(Testcontainers)가 필요한 테스트만 빼고 돌린다 —
// 단위/컨트롤러 테스트 수백 건이 컨테이너 기동을 기다리지 않게 하려는 것뿐이고,
// 관문은 여전히 `./gradlew test` 다 (이 태스크는 check 에 걸지 않는다).
// 별도 태그가 필요 없는 이유: Docker 를 쓰는 클래스는 이미 *IntegrationTest 로 명명돼 있다.
tasks.register('fastTest', Test) {
	group = 'verification'
	description = 'Docker 없이 돌아가는 테스트만 실행한다 (통합 테스트 제외).'
	useJUnitPlatform()
	// Java 플러그인이 커스텀 Test 태스크에 기본 test 스위트를 복사하던 관례는
	// Gradle 9 에서 사라진다. 안 적으면 테스트 0건을 조용히 건너뛴다.
	testClassesDirs = testing.suites.test.sources.output.classesDirs
	classpath = testing.suites.test.sources.runtimeClasspath
	filter {
		excludeTestsMatching '*IntegrationTest'
		excludeTestsMatching '*LiveTest'
		excludeTestsMatching 'com.example.mateon.MateonBackendApplicationTests'
	}
	// 단축 태스크라 커버리지에 넣지 않는다. 넣으면 Docker 통합 테스트가 빠져
	// 과소측정되고, 로컬에서 뭘 돌렸느냐에 숫자가 흔들린다.
	jacoco.enabled = false
}

// AI 서버 스텁을 상대로 응답 역직렬화와 DB 저장까지 확인하는 태스크.
// test/fastTest 양쪽에서 빠져 있고 여기서만 돈다 — fastTest 와 극성이 반대다.
// fastTest 는 편의용 단축이라 빠진 것도 관문(test)에서는 도는데, *LiveTest 는 밖에
// 뭔가가 떠 있어야만 의미가 있어서 어느 관문에도 걸지 않는다.
//
// 필요한 것 두 가지:
//   1) ai-stub (pwsh 7) — 없으면 전건 skip 된다. 실패가 아니라 건너뜀이라 조용하니,
//      "통과"를 보고 안심하기 전에 실행 건수를 확인할 것.
//   2) Docker — *PersistenceLiveTest 가 IntegrationTestBase 를 상속해 Postgres 를 띄운다.
tasks.register('liveTest', Test) {
	group = 'verification'
	description = 'ai-stub 을 상대로 AI 응답 역직렬화와 DB 저장을 확인한다 (스텁+Docker 필요).'
	useJUnitPlatform()
	// Java 플러그인이 커스텀 Test 태스크에 기본 test 스위트를 복사하던 관례는
	// Gradle 9 에서 사라진다. 안 적으면 테스트 0건을 조용히 건너뛴다.
	testClassesDirs = testing.suites.test.sources.output.classesDirs
	classpath = testing.suites.test.sources.runtimeClasspath
	filter {
		includeTestsMatching '*LiveTest'
	}
	// 검증 대상이 우리 코드가 아니라 밖에 떠 있는 스텁이다. 입력(클래스 파일)이 그대로여도
	// 스텁 쪽이 바뀌었을 수 있으므로 UP-TO-DATE 로 건너뛰게 두면 안 된다.
	outputs.upToDateWhen { false }
	doFirst {
		if (!System.getenv('AI_STUB_BASE_URL')) {
			logger.lifecycle('AI_STUB_BASE_URL 이 없어 전건 skip 됩니다. 먼저 스텁을 띄우세요:')
			logger.lifecycle('  pwsh -File scripts/test/debug/ai-stub/stub-ai-server.ps1 -Port 8000')
			logger.lifecycle('  $env:AI_STUB_BASE_URL = "http://localhost:8000"')
			logger.lifecycle('  ./gradlew liveTest')
		}
	}
	// 관문에도 없고 밖에 뜬 스텁에 숫자가 묶이므로 커버리지에 넣지 않는다.
	jacoco.enabled = false
}

// 커버리지는 측정만 한다. 임계값 게이트(jacocoTestCoverageVerification)는
// 베이스라인을 보기 전에는 걸지 않는다.
//
// 제외 원칙: 실행 경로가 의미 없는 것(엔트리, 순수 설정, debug, DTO/페이로드,
// JPA 모델이 domain 밖에 있는 Event). domain 패키지는 빼지 않는다 —
// isFullWith / isExpired / isOwnedBy 같은 행동이 엔티티에 있다.
// *Request$*.class 는 IntentExtractRequest$Message 같은 내부 클래스용이다.
// *Request* 로 넓히면 TeamEmbeddingRefreshRequestedEvent 까지 빠진다.
def jacocoExcludes = [
	'**/MateonBackendApplication.class',
	'**/dto/**',
	'**/debug/**',
	'**/*Properties.class',
	'**/*Request.class',
	'**/*Request$*.class',
	'**/*Response.class',
	'**/*Response$*.class',
	'**/common/config/AsyncConfig.class',
	'**/common/config/OpenApiConfig.class',
	'**/common/config/RestTemplateConfig.class',
	'**/common/config/SchedulingConfig.class',
	'**/common/ai/AiRestTemplateConfig.class',
	'**/common/storage/S3ClientConfig.class',
	'**/events/models/**',
]

tasks.named('jacocoTestReport', JacocoReport) {
	// test.finalizedBy 가 실행을 붙인다. 여기다 dependsOn test 를 걸면
	// 테스트 실패 시 리포트가 SKIPPED 가 되어 CI 아티팩트가 비어 남는다.
	mustRunAfter tasks.named('test')
	reports {
		xml.required = true
		html.required = true
		csv.required = false
	}
	classDirectories.setFrom(
		sourceSets.main.output.classesDirs.asFileTree.matching {
			exclude jacocoExcludes
		}
	)
}

