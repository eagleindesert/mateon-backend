# ARM 기반 클라우드 배포용 Compose
# ------------------------------------------------------------------------------
# 로컬에서 소스를 빌드하지 않고, DockerHub 에 이미 push 된 이미지를 pull 하여 실행합니다.
# 이미지 빌드/푸시: ./scripts/docker/deploy-dockerhub.sh --tag v1.0.0 --platform linux/arm64
#
# 사용법 (배포 서버에서):
#   1) 이 파일과 .env, start.sh 세 파일을 같은 디렉터리로 복사한다.
#      배포 .env 에는 MAIL·JWT·AI·OCI 시크릿도 함께 넣는다.
#   2) DOCKERHUB_USERNAME / TAG 를 .env 또는 셸 환경변수로 지정한다.
#   3) ./start.sh (특정 버전을 pull 후 실행: ./start.sh v1.0.0)
#      같은 CLI: docker compose -f docker-compose-deployment.yaml up -d
#
# 종료:  docker compose -f docker-compose-deployment.yaml down
# 갱신:  docker compose -f docker-compose-deployment.yaml pull && \
#        docker compose -f docker-compose-deployment.yaml up -d
#
# pgAdmin 은 이 파일에 없다. DB GUI 는 docker-compose-pgadmin.yml 을 따로 띄운다
# (특정 앱에 묶이지 않은 범용 파일). 호스트 localhost:5433 로 postgres 에 붙는다.
# ------------------------------------------------------------------------------
services:
  app:
    # DockerHub 이미지를 pull (빌드하지 않음). 태그 미지정 시 latest.
    image: ${DOCKERHUB_USERNAME:-eagleindesert}/${DOCKERHUB_IMAGE:-mateon-backend}:${TAG:-latest}
    # build-start.sh 는 방금 빌드한 로컬 이미지를 실행하도록 never 를 지정한다.
    pull_policy: ${APP_PULL_POLICY:-missing}
    # ARM 클라우드에서 멀티아치가 아닌 이미지를 강제 지정하고 싶을 때 사용.
    # 이미지가 arm64 로 push 되어 있어야 정상 동작합니다.
    platform: ${APP_PLATFORM:-linux/arm64}
    container_name: mateon-app
    restart: unless-stopped
    # dev 프로필로 도는 서버라 로그가 DEBUG 다. json-file 드라이버 기본값은 무제한이라
    # 그대로 두면 디스크가 찬다(Always Free 급 인스턴스에서는 실제로 찬다).
    #
    # 총량은 max-size × max-file = 1GB 다. 여유 20GB 중 5% 인데, 나머지는 이미지 태그와
    # postgres 볼륨이 계속 먹으므로 로그에 더 주지 않는다. 반대로 이보다 짜게 잡으면
    # (예: 10m×3=30MB) DEBUG 로그가 몇 시간 만에 밀려나 정작 장애 때 볼 게 없다.
    #
    # 파일을 잘게 쪼개는 건 회전이 지워 버리는 단위가 곧 max-size 라서다 — 1000m×1 이면
    # 한 번 넘칠 때 1GB 가 통째로 사라진다.
    #
    # 실제 증가 속도를 보고 조정한다(서버에서):
    #   du -h $(docker inspect --format='{{.LogPath}}' mateon-app)
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"
    # 배포 설정과 시크릿은 .env 하나로 받는다. postgres 에는 아래 DB 변수만 전달한다.
    env_file:
      - .env
    environment:
      # 운영 환경이 아직 없다. 이 서버는 "배포된 개발 서버"이고, prod 프로필은 만들어만 뒀지
      # 켜는 곳이 없다. 그러니 여기서 prod 를 주면 실제와 다른 소리를 하는 셈이라 dev 로 둔다.
      # (spring.profiles.default 가 dev 라 이 줄이 없어도 결과는 같지만, 배포 파일을 열었을 때
      #  어느 프로필로 도는지 바로 보이도록 남긴다.)
      #
      # dev 로 돈다는 게 서버에서 뜻하는 것 — 운영으로 승격할 때 이 목록을 되짚는다:
      #   - CORS 기본값이 "*" 다. 좁히려면 .env 에 CORS_ALLOWED_ORIGINS 를 준다(그쪽이 이긴다).
      #     prod 와 달리 설정 누락을 부팅으로 잡아 주지 않으니 오타는 조용히 전체 허용이 된다.
      #   - /debug/oauth 가 열린다(DEBUG_OAUTH_ENABLED 기본 true). 서버에서 카카오 인가코드를
      #     받으려면 필요하고, 닫으려면 .env 에 false 를 준다.
      #   - 앱 로그가 DEBUG 다(prod 는 INFO). 조용히 시키려면 .env 에 LOG_LEVEL_APP=INFO.
      #     SQL 로그는 dev 도 기본이 꺼짐이라 그대로 두면 안 나온다 — 서버에서 잠깐 봐야 하면
      #     .env 에 JPA_SHOW_SQL=true 와 LOG_LEVEL_SQL=DEBUG 를 세트로 주고 끝나면 되돌린다.
      #   - 커넥션 풀이 10 이다(prod 는 20). 늘리려면 .env 의 DB_POOL_SIZE.
      SPRING_PROFILES_ACTIVE: dev
      # DB 는 아래 postgres 서비스로 연결 (compose 네트워크 내 서비스명)
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mateon_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      TZ: Asia/Seoul
    ports:
      - "${APP_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    container_name: mateon-postgres
    restart: unless-stopped
    # 체크포인트·연결 로그 정도라 app 만큼 나오지는 않는다. 다만 무제한으로 두면 서버가
    # 오래 살아 있는 만큼 계속 쌓이므로 상한만 걸어 둔다 (총 30MB).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: mateon_db
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      TZ: Asia/Seoul
    # 호스트 localhost:5433 으로 붙는다 (pgAdmin / psql). 127.0.0.1 에만 묶이므로
    # 공인 IP 로는 안 열린다. 앱은 계속 compose 네트워크의 postgres:5432.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - mateon-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d mateon_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mateon-postgres-data:
