# 독립 테스트 스택. 루트 .env와 운영 볼륨을 읽거나 공유하지 않는다.
# start.sh는 DockerHub 이미지를 pull하고, scripts/build-start.sh는 소스를 빌드해 실행한다.
# 두 스크립트 모두 --mode loadtest 또는 --mode ai-stub으로 실행 환경을 선택한다.
# 실행용 Compose에는 build를 두지 않는다. AI 스텁도 완성된 이미지를 사용한다.
services:
  app:
    image: ${DOCKERHUB_USERNAME:-eagleindesert}/${DOCKERHUB_IMAGE:-mateon-backend}:${TAG:-latest}
    platform: ${APP_PLATFORM:-linux/arm64}
    pull_policy: ${APP_PULL_POLICY:-missing}
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_CONFIG_IMPORT: ""
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mateon_loadtest
      SPRING_DATASOURCE_USERNAME: loadtest
      SPRING_DATASOURCE_PASSWORD: loadtest-only
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      LOG_LEVEL_APP: ${LOG_LEVEL_APP:-INFO}
      JPA_SHOW_SQL: "false"
      LOG_LEVEL_SQL: INFO
      DEBUG_OAUTH_ENABLED: "false"

      # 테스트 모드에서는 셸/설정 파일의 실서버 값으로 덮어쓸 수 없다.
      AI_BASE_URL: http://ai-stub:8000
      AI_INTERNAL_SECRET: loadtest-only
      AI_ROUTER_ENABLED: "false"
      AI_EVENT_EMBEDDING_BACKFILL_ENABLED: "false"
      OPENAI_API_KEY: ""
      SPRING_AI_OPENAI_API_KEY: ""
      SPRING_AI_OPENAI_BASE_URL: http://ai-stub:8000
      SPRING_AI_OPENAI_MAX_RETRIES: "0"
      JWT_SECRET: mateon-loadtest-key-only-0123456789abcdef

      SPRING_MAIL_HOST: 127.0.0.1
      MAIL_USERNAME: loadtest@example.invalid
      MAIL_PASSWORD: loadtest-only
      OCI_NAMESPACE: loadtest
      OCI_REGION: ap-chuncheon-1
      OCI_BUCKET: loadtest
      OCI_S3_ACCESS_KEY: loadtest-only
      OCI_S3_SECRET_KEY: loadtest-only
      OCI_BUCKET_MAX_BYTES: 0B
      KAKAO_REST_API_KEY: ""
      KAKAO_CLIENT_SECRET: ""
      KAKAO_REDIRECT_URIS: http://localhost:18081/auth/kakao/callback
      WEB_BASE_URL: http://localhost:18081
      TZ: Asia/Seoul
    networks: [isolated]
    depends_on:
      postgres:
        condition: service_healthy
      ai-stub:
        condition: service_healthy
    labels:
      com.mateon.loadtest: "true"

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: mateon_loadtest
      POSTGRES_USER: loadtest
      POSTGRES_PASSWORD: loadtest-only
    volumes:
      - loadtest-data:/var/lib/postgresql/data
    networks: [isolated]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U loadtest -d mateon_loadtest"]
      interval: 5s
      timeout: 3s
      retries: 20

  ai-stub:
    image: ${DOCKERHUB_USERNAME:-eagleindesert}/${AI_STUB_DOCKERHUB_IMAGE:-mateon-ai-stub}:${AI_STUB_TAG:-latest}
    platform: ${APP_PLATFORM:-linux/arm64}
    # build-start.sh는 앱과 스텁 모두 방금 빌드한 로컬 이미지를 실행하도록 never를 지정한다.
    pull_policy: ${APP_PULL_POLICY:-missing}
    command:
      - --host
      - 0.0.0.0
      - --expected-secret
      - loadtest-only
      - --mode
      - ${MATEON_TEST_MODE:-loadtest}
      - --delay-ms
      - ${AI_STUB_DELAY_MS:-0}
      - --quiet
    networks: [isolated]
    healthcheck:
      test: [CMD, uv, run, --offline, --no-project, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/__stub', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 10

  proxy:
    image: nginx:1.28-alpine
    environment:
      MATEON_TEST_MODE: ${MATEON_TEST_MODE:-loadtest}
    volumes:
      - ./scripts/test/jmeter/nginx.conf:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "${LOADTEST_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-18081}:8080"
    networks: [entrance, isolated]
    depends_on: [app]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 30

networks:
  entrance: {}
  isolated:
    internal: true

volumes:
  loadtest-data: {}
